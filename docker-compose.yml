services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rhythmguard
      POSTGRES_PASSWORD: rhythmguard_dev
      POSTGRES_DB: rhythmguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhythmguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgresql://rhythmguard:rhythmguard_dev@postgres:5432/rhythmguard
      PORT: 3100
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
